[package]
name = "wanderlog-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
include = ["Cargo.toml", "README.md", "LICENSE", "NOTICE", "src/**", "tests/**"]
description = "Local stdio MCP server and CLI for the unofficial Wanderlog client"
documentation = "https://docs.rs/wanderlog-mcp"
keywords = ["wanderlog", "mcp", "travel", "cli"]
categories = ["command-line-utilities"]

[features]
default = []
live-tests = []
native-keychain-tests = []

[dependencies]
wanderlog-client = { path = "../wanderlog-client", version = "=0.1.0", features = ["schema"] }
anyhow.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
rmcp = { version = "3.5.1", features = ["transport-io"] }
rpassword = "7.5.4"
serde.workspace = true
serde_json.workspace = true
percent-encoding.workspace = true
tokio = { workspace = true, features = ["io-std"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = "4.2.0"

[dev-dependencies]
tokio = { workspace = true, features = ["process", "io-util", "test-util"] }
futures-util.workspace = true
tokio-tungstenite.workspace = true
tempfile = "3.27.0"

[[test]]
name = "e2e"
path = "tests/e2e.rs"
required-features = ["live-tests"]

[[test]]
name = "native_keychain"
path = "tests/native_keychain.rs"
required-features = ["native-keychain-tests"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
