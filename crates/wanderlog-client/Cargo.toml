[package]
name = "wanderlog-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
readme = "README.md"
include = ["Cargo.toml", "README.md", "LICENSE", "NOTICE", "src/**", "tests/**"]
description = "Unofficial Wanderlog REST and ShareDB client with atomic itinerary planning"
documentation = "https://docs.rs/wanderlog-client"
keywords = ["wanderlog", "travel", "itinerary", "sharedb"]
categories = ["api-bindings"]

[features]
default = []
schema = ["dep:schemars"]

[dependencies]
anyhow.workspace = true
futures-util.workspace = true
httpdate.workspace = true
rand.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[package.metadata.docs.rs]
features = ["schema"]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
