[package]
name = "wanderlog-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Unofficial Rust client for Wanderlog REST, ShareDB and itinerary edits"
readme = "README.md"
keywords = ["wanderlog", "travel", "itinerary", "api", "client"]
categories = ["api-bindings"]
publish = ["crates-io"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "NOTICE"]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[features]
default = []
# Synthetic loopback tests; not a stable application interface.
test-support = ["tokio/net", "tokio/io-util"]

[dependencies]
anyhow.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
httpdate = "1.0.3"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "query"] }
schemars = "1.2.2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.30.0", features = ["connect", "rustls-tls-native-roots"], default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util"] }
