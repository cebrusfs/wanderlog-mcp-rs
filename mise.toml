[tools]
# Prebuilt binary via the aqua registry (no local compilation of third-party code).
cargo-deny = "0.20.2"
bun = "1.4.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"

[tasks.check]
description = "Format check, clippy (warnings are errors) and unit tests"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --locked --all-targets -- -D warnings",
  "cargo test --workspace --locked",
  "cargo doc --workspace --no-deps --locked",
]

[tasks.e2e]
description = "Live round-trip on a throwaway trip (needs WANDERLOG_E2E_TRIP_ID and a stored session)"
run = "cargo test -p wanderlog-mcp --features live-tests --test e2e -- --ignored --nocapture"

[tasks.coverage]
description = "Unit/mock line coverage as LCOV in $TMPDIR (requires llvm-tools-preview); excludes live e2e"
run = 'cargo llvm-cov --workspace --locked --ignore-filename-regex "(/tests/|_tests.rs$|test_support.rs$)" --fail-under-lines 90 --remap-path-prefix --lcov --output-path "${COVERAGE_FILE:-${TMPDIR:?TMPDIR is required}/wanderlog-mcp-lcov.info}"'

[tasks.install]
description = "Install the binary into ~/.cargo/bin"
run = "cargo install --path crates/wanderlog-mcp --locked"

[tasks.audit]
description = "Supply-chain policy: RustSec advisories, licenses, bans, sources (needs network)"
run = "cargo deny check"

[tasks.package]
description = "Build and verify macOS desktop packages in a new temporary directory (requires Bun and network)"
run = ["bun install --frozen-lockfile", "bun scripts/package.mjs"]

[tasks.lint-ci]
description = "Validate GitHub Actions workflows"
run = "actionlint"

[tasks.ci]
description = "Validate workflows and run unit/doc tests with local mocks; excludes live e2e"
run = ["mise run lint-ci", "mise run check"]
