name: Prepare client split (temporary)

on:
  push:
    branches: [codex/split-client-release]
    paths:
      - scripts/prepare-split.py
      - .github/workflows/prepare-split.yml

permissions:
  contents: read

concurrency:
  group: prepare-wanderlog-client-split
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'cebrusfs/wanderlog-mcp-rs'
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Require unchanged branch
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/split-client-release | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Apply guarded split and format
        run: |
          python3 scripts/prepare-split.py
          cargo fmt --all
          python3 scripts/release-check.py
          git diff --check
      - name: Commit source changes only to preparation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock src crates mise.toml deny.toml scripts/package.mjs README.md docs/development.md
          git commit -m 'refactor: split reusable Wanderlog client from local MCP'
          test "$(git ls-remote origin refs/heads/codex/split-client-release | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/codex/split-client-release
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Validate workspace and standalone client
        run: |
          mise run ci
          cargo test -p wanderlog-client --no-default-features --locked
          cargo package --locked -p wanderlog-client
      - name: Build and smoke-test desktop packages without live credentials
        run: TMPDIR="$RUNNER_TEMP" mise run package
