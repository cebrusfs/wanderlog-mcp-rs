name: Crates.io (manual)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Actually publish after checks, requiring tag and repository opt-in
        type: boolean
        default: false
        required: true
      packages:
        description: Select mcp only to resume after confirmed client publication
        type: choice
        options: [both, client, mcp]
        default: both
        required: true

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Install Rust checks
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Test and verify library package
        run: |
          mise run ci
          python3 scripts/release-check.py
          cargo package --locked -p wanderlog-client
          cargo package --list --locked -p wanderlog-mcp

  publish:
    if: inputs.publish && vars.ENABLE_CRATES_IO_PUBLISH == 'true'
    needs: validate
    runs-on: macos-15
    timeout-minutes: 30
    environment: crates-io
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tag and main ancestry
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          python3 scripts/release-check.py --tag "$GITHUB_REF_NAME"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install release toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Publish sequentially, never blindly retry uploads
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          test -n "$CARGO_REGISTRY_TOKEN" || { echo 'Missing crates-io environment token'; exit 1; }
          case "$PACKAGES" in
            both|client)
              cargo publish --dry-run --locked -p wanderlog-client
              cargo publish --locked -p wanderlog-client
              ;;
            mcp) ;;
            *) echo 'Invalid selection'; exit 1 ;;
          esac
          case "$PACKAGES" in
            both|mcp)
              cargo publish --dry-run --locked -p wanderlog-mcp
              cargo publish --locked -p wanderlog-mcp
              ;;
          esac
