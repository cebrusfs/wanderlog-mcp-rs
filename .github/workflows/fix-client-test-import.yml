name: Correct client test helper import (temporary)

on:
  push:
    branches: [codex/split-client-release]
    paths: [.github/workflows/fix-client-test-import.yml]

permissions:
  contents: read

jobs:
  correct:
    if: github.repository == 'cebrusfs/wanderlog-mcp-rs'
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Correct only the obsolete test import
        run: |
          test "$(git ls-remote origin refs/heads/codex/split-client-release | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/wanderlog-client/src/edit.rs')
          text = path.read_text()
          old = 'use crate::rest::tests::{login_server, response};'
          assert text.count(old) == 1, 'Unexpected file version; refusing broad replacement'
          path.write_text(text.replace(old, 'use crate::test_support::{login_server, response};'))
          PY
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable fmt --all
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/wanderlog-client/src/edit.rs
          git commit -m 'fix: import shared test helpers directly in client edit tests'
          test "$(git ls-remote origin refs/heads/codex/split-client-release | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/codex/split-client-release
