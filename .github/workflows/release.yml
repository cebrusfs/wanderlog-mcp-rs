name: Desktop packages

# Publishing remains opt-in; ordinary CI builds downloadable packages automatically.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GitHub Releases (requires selecting an existing version tag)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: vars.ENABLE_RELEASE_WORKFLOW == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    if: vars.ENABLE_RELEASE_WORKFLOW == 'true' && inputs.publish
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.checks.outputs.package_tag }}
      RELEASE_REF_TYPE: ${{ github.ref_type }}
      RELEASE_REF_NAME: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-macos-arm64
          path: ${{ runner.temp }}/release-assets
      - name: Verify assets and publish the existing tag
        run: |
          test "$RELEASE_REF_TYPE" = tag
          test "$RELEASE_REF_NAME" = "$RELEASE_TAG"
          cd "$RUNNER_TEMP/release-assets"
          sha256sum --check SHA256SUMS
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/tags/$RELEASE_TAG" --jq .sha)
          test "$tag_sha" = "$GITHUB_SHA"
          gh release create "$RELEASE_TAG" ./*.mcpb ./*.zip ./SHA256SUMS \
            --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
