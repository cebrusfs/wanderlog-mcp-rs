[package]
name = "wanderlog-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "MCP server and CLI that let AI agents read and edit Wanderlog trips"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
keyring = "4.2.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "query"] }
rmcp = { version = "3.5.1", features = ["transport-io"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "io-std", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect", "rustls-tls-native-roots"], default-features = false }
