[workspace]
members = ["crates/wanderlog-client", "crates/wanderlog-mcp"]
default-members = ["crates/wanderlog-mcp"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/cebrusfs/wanderlog-mcp-rs"
homepage = "https://github.com/cebrusfs/wanderlog-mcp-rs"

[workspace.dependencies]
anyhow = "1.0.104"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
httpdate = "1.0.3"
rand = "0.10.3"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "query"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect", "rustls-tls-native-roots"], default-features = false }
